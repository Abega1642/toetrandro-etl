name: CI - Tests

on:
  push:
    branches: [preprod, prod]
  pull_request:
    branches: [preprod, prod]

jobs:
  run-tests:
    name: Run All Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |  
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install apache-airflow==3.0.1
          airflow db migrate

      - name: Set Airflow Variables for CI
        run: |  
          airflow variables set OPENWEATHER_API_KEY ${{ secrets.OPENWEATHER_API_KEY }}

      - name: Run tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"
