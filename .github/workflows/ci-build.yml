name: CI - Build airflow image

on:
  push:
    branches: [prod, preprod]
  pull_request:
    branches: [prod, preprod]

jobs:
  build-and-init-airflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy .env.template to .env
        run: cp .env.template .env

      - name: Create Docker network
        run: docker network create airflow-ci-net

      - name: Start Postgres container
        run: |
          docker run -d \
            --name postgres-ci \
            --network airflow-ci-net \
            -e POSTGRES_USER=airflow \
            -e POSTGRES_PASSWORD=airflow \
            -e POSTGRES_DB=airflow \
            -p 5432:5432 \
            postgres:15

      - name: Wait for Postgres to be ready
        run: |
          for i in {1..10}; do
            docker exec postgres-ci pg_isready -U airflow && break
            echo "Waiting for Postgres..."
            sleep 5
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Airflow Docker image
        run: docker build -t airflow-ci-test .

      - name: Initialize Airflow DB (with retry)
        run: |
          for i in {1..10}; do
            docker run --network airflow-ci-net \
              -e AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-ci:5432/airflow \
              -e AIRFLOW__CORE__FERNET_KEY=dummy_fernet_key_here \
              airflow-ci-test airflow db migrate && break
            echo "Retrying db migrate..."
            sleep 5
          done

      - name: Start Airflow API server
        run: |
          docker run -d \
            --name airflow-api \
            --network airflow-ci-net \
            -e AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-ci:5432/airflow \
            -e AIRFLOW__CORE__FERNET_KEY=dummy_fernet_key_here \
            -p 8080:8080 \
            airflow-ci-test airflow api-server

      - name: Start Airflow scheduler
        run: |
          docker run -d \
            --name airflow-scheduler \
            --network airflow-ci-net \
            -e AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-ci:5432/airflow \
            -e AIRFLOW__CORE__FERNET_KEY=dummy_fernet_key_here \
            airflow-ci-test airflow scheduler

      - name: Start Airflow DAG processor
        run: |
          docker run -d \
            --name airflow-dag-processor \
            --network airflow-ci-net \
            -e AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-ci:5432/airflow \
            -e AIRFLOW__CORE__FERNET_KEY=dummy_fernet_key_here \
            airflow-ci-test airflow dag-processor

      - name: Verify Airflow API is up
        run: |
          sleep 20
          curl -I http://localhost:8080 | grep "HTTP/" || (
            echo "Airflow API failed to respond"
            docker logs airflow-api
            exit 1
          )
